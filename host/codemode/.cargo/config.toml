# V8 150.4.0 has no sandbox prebuilt archive for macOS (the download 404s), so
# it must be built from source with V8_FROM_SOURCE=1. The crates.io package
# does not ship third_party/icu/common/icudtl.dat, so GN's default
# icu_use_data_file=false path (embedding ICU data as assembly) cannot work.
# These args match the verified Codex build: V8 loads ICU data from the
# deno_core_icudata crate at runtime and stubs its own copy.
#
# v8_enable_temporal_support=false matches the verified Codex build args.
[env]
GN_ARGS = "icu_use_data_file=true icu_use_stub_data=true v8_enable_temporal_support=false"
