[workspace]
resolver = "2"
members = ["crates/shim", "crates/protocol", "crates/runtime", "crates/host"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"

[workspace.dependencies]
anyhow = "1"
base64 = "0.22.1"
clap = { version = "4", features = ["derive"] }
deno_core_icudata = "0.77.0"
futures = { version = "0.3", default-features = false }
serde = { version = "1", features = ["rc", "derive"] }
serde_json = "1"
tokio = "1"
tokio-stream = "0.1.18"
tokio-util = { version = "0.7.18", features = ["rt"] }
tracing = "0.1.44"
tracing-subscriber = "0.3.22"
uuid = { version = "1", features = ["v4"] }
v8 = { version = "=150.4.0", features = ["v8_enable_sandbox"] }
wuu-codemode-shim = { path = "crates/shim" }
codex-code-mode-protocol = { path = "crates/protocol" }
codex-code-mode-runtime = { path = "crates/runtime" }
