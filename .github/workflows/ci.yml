name: CI

on:
  pull_request:
    paths-ignore:
      - "docs/**"
      - "docs-site/**"
  push:
    branches:
      - main
    paths-ignore:
      - "docs/**"
      - "docs-site/**"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repository-check:
    name: Repository check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version

      - name: Check repository metadata
        run: make repository-metadata-check

  go-check:
    name: Go check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Check
        run: make check-go

      - name: Test
        run: make test-go

      - name: Build
        run: make build-go

  desktop-check:
    name: Desktop check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Install
        run: npm ci --prefix desktop

      - name: Check generated theme contracts
        run: make theme-surface-matrix-check

      - name: Typecheck
        run: make check-desktop

      - name: Test
        run: make test-desktop

      - name: Build
        run: make build-desktop

  clients-check:
    name: Clients check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: |
            clients/core/package-lock.json
            clients/mobile/package-lock.json
            clients/mobile-web/package-lock.json
            packages/plugin-sdk/package-lock.json
            packages/protocol/package-lock.json

      - name: Install dependencies
        run: |
          pids=()
          for workspace in \
            clients/core \
            clients/mobile \
            clients/mobile-web \
            packages/plugin-sdk \
            packages/protocol; do
            npm ci --prefix "$workspace" &
            pids+=("$!")
          done
          status=0
          for pid in "${pids[@]}"; do
            wait "$pid" || status=1
          done
          exit "$status"

      - name: Check
        run: make check-clients

      - name: Test
        run: make test-clients

      - name: Build
        run: make build-clients

  macos-check:
    name: macOS native check
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Install
        working-directory: desktop
        run: |
          npm ci
          node node_modules/electron/install.js
          node -e 'require("electron")'

      - name: Test native helper
        run: make test-native

      - name: Package macOS app
        run: make build-macos

  windows-check:
    name: Windows native check
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      # The full Go suite includes Unix permission, shell, and file-lifecycle
      # contracts. Keep this job focused on the Windows-native boundaries it can
      # validate rather than turning expected POSIX differences into a red gate.
      - name: Test Windows-native runtime boundaries
        run: |
          go test ./internal/process -run '^Test(VerifyProcessGroupRejectsMismatchedRecords|LookupProcessGroupIsPid|PTYUnsupported|TaskkillTreeIgnoresInvalidPids|ProcessExistsSelf)$'
          go test ./internal/session -run '^TestInferenceRuntimeProcessAliveWindows$'
          go test ./internal/tools -run '^TestProcessSandbox(PolicyMapsWorkspaceBoundary|TempRejectsSymlink|PolicyFailsClosedWithoutBackend)$'

      - name: Install Desktop dependencies
        run: npm ci --prefix desktop

      - name: Check and test cross-platform Desktop code on Windows
        run: |
          npm --prefix desktop run typecheck
          npm --prefix desktop run test:unit

      - name: Package unpacked Windows app
        run: npm --prefix desktop run pack:win
